name: 📱 Build DMC System Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 📦 Build Android Debug APK
        working-directory: ./android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: 📁 Rename and Prepare APK
        run: |
          mkdir -p output_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output_apk/DMC_System.apk
          ls -lh output_apk/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMC_System_Android_APK
          path: output_apk/DMC_System.apk
          retention-days: 30
